name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.19.0
          - 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@10.9.7
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run conformance:check
      - run: npm run test:package

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@10.9.7
      - run: npm ci
      - run: npm run benchmark

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.23.x
          - stable
    defaults:
      run:
        working-directory: ports/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ports/go/go.sum
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    defaults:
      run:
        working-directory: ports/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ports/python/pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest

  python-package:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ports/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ports/python/pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Test wheel installation
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "from importlib.resources import files; import worldcut; assert files('worldcut').joinpath('py.typed').is_file(); assert worldcut.ENGINE_VERSION == '0.1.2'"
          .wheel-venv/bin/worldcut-py --help
          .wheel-venv/bin/worldcut-py ../../examples/coherent-deployment.json
      - name: Test source distribution independently
        run: |
          mkdir .sdist-test
          tar -xzf dist/*.tar.gz -C .sdist-test --strip-components=1
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install "./.sdist-test[dev]"
          cd .sdist-test
          ../.sdist-venv/bin/pytest

  dotnet:
    name: .NET on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: ports/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore with locked dependencies
        run: dotnet restore --locked-mode
      - name: Check formatting and code style
        run: dotnet format --verify-no-changes --no-restore
      - name: Build with warnings as errors
        run: dotnet build --configuration Release --no-restore
      - name: Test net8.0 and net10.0
        run: dotnet test --configuration Release --no-build

  dotnet-package:
    name: .NET package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ports/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore with locked dependencies
        run: dotnet restore --locked-mode
      - name: Audit dependencies for known vulnerabilities
        # NuGetAudit is enabled in ports/dotnet/Directory.Build.props; the
        # explicit escalation keeps a new advisory from passing as a warning.
        run: dotnet restore --locked-mode --no-cache "-warnaserror:NU1901;NU1902;NU1903;NU1904"
      - name: Pack, inspect, and consume both packages in isolation
        shell: pwsh
        run: ./scripts/package-smoke.ps1

  required:
    name: Required checks
    if: always()
    needs:
      - node
      - benchmark
      - go
      - python
      - python-package
      - dotnet
      - dotnet-package
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI
        env:
          NODE_RESULT: ${{ needs.node.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          GO_RESULT: ${{ needs.go.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PYTHON_PACKAGE_RESULT: ${{ needs.python-package.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          DOTNET_PACKAGE_RESULT: ${{ needs.dotnet-package.result }}
        run: |
          test "$NODE_RESULT" = "success"
          test "$BENCHMARK_RESULT" = "success"
          test "$GO_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$PYTHON_PACKAGE_RESULT" = "success"
          test "$DOTNET_RESULT" = "success"
          test "$DOTNET_PACKAGE_RESULT" = "success"
