name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: Validate release package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@10.9.7
      - run: npm ci
      - name: Validate release tag
        run: |
          git fetch origin main:refs/remotes/origin/main
          node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm run release:check
      - name: Verify release commit passed main CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | [.id,.conclusion,.event,.head_branch,.head_repository.full_name] | @tsv" \
              | head -n 1
          )
          test -n "$RUN"
          IFS=$'\t' read -r RUN_ID CONCLUSION EVENT BRANCH REPOSITORY <<< "$RUN"
          test "$CONCLUSION" = "success"
          test "$EVENT" = "push"
          test "$BRANCH" = "main"
          test "$REPOSITORY" = "$GITHUB_REPOSITORY"
          echo "Verified CI run $RUN_ID for $GITHUB_SHA"
      - name: Create exact release artifact
        run: |
          mkdir release-artifacts
          npm pack --json --pack-destination release-artifacts \
            > release-artifacts/pack.json
          PACKAGE_FILE=$(node -e \
            "const p=require('./release-artifacts/pack.json'); process.stdout.write(p[0].filename)")
          node scripts/test-package.mjs \
            "release-artifacts/$PACKAGE_FILE" \
            release-artifacts/pack.json
          cd release-artifacts
          sha256sum "$PACKAGE_FILE" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Publish npm package
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org/
      - name: Use supported npm
        run: npm install --global npm@10.9.7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish exact package artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_FILE=$(node -e \
            "const p=require('./release-artifacts/pack.json'); process.stdout.write(p[0].filename)")
          EXPECTED_SHA=$(cut -d ' ' -f1 release-artifacts/SHA256SUMS)
          if TARBALL_URL=$(npm view "worldcut@$VERSION" dist.tarball --json 2>/dev/null); then
            TARBALL_URL=$(node -e \
              "process.stdout.write(JSON.parse(process.argv[1]))" "$TARBALL_URL")
            curl --fail --silent --show-error --location \
              "$TARBALL_URL" \
              --output published.tgz
            echo "$EXPECTED_SHA  published.tgz" | sha256sum --check
            echo "worldcut@$VERSION is already published with the expected artifact"
            exit 0
          fi
          npm publish "release-artifacts/$PACKAGE_FILE" \
            --access public \
            --provenance

  github:
    name: Create GitHub release
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_FILE=$(node -e \
            "const p=require('./release-artifacts/pack.json'); process.stdout.write(p[0].filename)")
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "release-artifacts/$PACKAGE_FILE" \
              release-artifacts/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              "release-artifacts/$PACKAGE_FILE" \
              release-artifacts/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "WorldCut $VERSION"
          fi
          rm -rf release-verification
          mkdir release-verification
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_FILE" \
            --pattern SHA256SUMS \
            --dir release-verification
          cd release-verification
          sha256sum --check SHA256SUMS
